<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Message Display App</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background-color: transparent;
    }
    body {
      font-family: Arial, sans-serif;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      cursor: default;
      -webkit-user-select: none;
      user-select: none;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 15px;
      margin: 5px;
      height: calc(100% - 10px);
      width: calc(100% - 10px);
    }
    .container {
      padding: 30px;
      background-color: transparent;
      border-radius: 15px;
      max-width: 80%;
      transition: opacity 0.5s ease-in-out;
    }
    .name {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 10px;
      color: white;
    }
    .message {
      font-size: 18px;
      line-height: 1.4;
      color: white;
    }
    .drag-area {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 30px;
      -webkit-app-region: drag;
    }
  </style>
</head>
<body>
  <div class="drag-area"></div>
  <div class="container" id="message-container">
    <div class="name" id="name-display">Loading messages...</div>
    <div class="message" id="message-display">Please wait</div>
  </div>

  <script>
    // Message queue system
    const messageQueue = [];
    
    let currentIndex = 0;
    const container = document.getElementById('message-container');
    const nameDisplay = document.getElementById('name-display');
    const messageDisplay = document.getElementById('message-display');
    
    // Animation variables
    let animationRunning = false;
    let lastTimestamp = 0;
    let currentTimeout = null;
    let timeElapsed = 0;
    let fadeState = 'in'; // 'in', 'display', 'out'
    let currentItem = null;
    
    // Track messages we've already seen to prevent duplicates
    const processedMessages = new Set();
    
    // Force the renderer to keep working even when the page is in background
    const forceRendering = () => {
      // Create a tiny canvas element and change it slightly each frame
      const canvas = document.createElement('canvas');
      canvas.width = 1;
      canvas.height = 1;
      const ctx = canvas.getContext('2d');
      let frame = 0;
      
      function tick() {
        frame++;
        // Draw something different each frame to force a redraw
        ctx.fillStyle = `rgb(${frame % 255},0,0)`;
        ctx.fillRect(0, 0, 1, 1);
        requestAnimationFrame(tick);
      }
      
      requestAnimationFrame(tick);
    };
    
    // Format HCS status with network information
    function formatHcsStatus(status) {
      let statusText = '';
      let networkBadge = '';
      let readOnlyBadge = '';
      
      if (status.network) {
        networkBadge = `<span class="network-badge network-${status.network}">${status.network}</span>`;
      }
      
      if (status.readOnly) {
        readOnlyBadge = `<span class="network-badge readonly-badge">read-only</span>`;
      }
      
      if (status.connected) {
        statusText = `HCS: Connected to topic ${status.topicId}${networkBadge}${readOnlyBadge}`;
      } else {
        statusText = `HCS: Disconnected (${status.error || 'unknown error'})${networkBadge}${readOnlyBadge}`;
      }
      
      return statusText;
    }
    
    // Start the animation system
    function startAnimation() {
      if (animationRunning) return;
      animationRunning = true;
      
      // Initial setup
      container.style.opacity = 0;
      timeElapsed = 0;
      fadeState = 'in';
      
      // Update the display once to ensure we have content
      if (messageQueue.length > 0) {
        currentItem = messageQueue[currentIndex];
        nameDisplay.textContent = currentItem.name;
        messageDisplay.textContent = currentItem.message;
      } else {
        // Hide the container when there are no messages
        container.style.display = 'none';
      }
      
      // Start animation loop
      requestAnimationFrame(animationFrame);
    }
    
    // Function to speak the message using ElevenLabs TTS
    function speakMessage(name, message) {
      // Don't speak system messages
      if (name === "System") {
        console.log("Skipping TTS for system message");
        return Promise.resolve();
      }
      
      return new Promise((resolve) => {
        // Try to use ElevenLabs if available
        if (window.tts) {
          // Check if we already have the audio path
          const currentMessage = messageQueue[currentIndex];
          if (currentMessage && currentMessage.audioPath) {
            // Update display before playing audio
            nameDisplay.textContent = currentMessage.name;
            messageDisplay.textContent = currentMessage.message;
            container.style.display = 'block';
            container.style.opacity = '1';
            
            // Create an audio element to play the sound
            const audio = new Audio(`file://${currentMessage.audioPath}`);
            
            // Set up event handlers
            audio.onended = () => {
              console.log("ElevenLabs TTS playback completed");
              // Notify main process that TTS playback is complete
              if (window.api) {
                window.api.send('tts-complete');
              }
              resolve();
            };
            
            audio.onerror = (e) => {
              console.error("Audio playback error:", e);
              resolve(); // Resolve anyway to prevent blocking
            };
            
            // Play the audio
            audio.play().catch(err => {
              console.error("Error playing audio:", err);
              resolve();
            });
          } else {
            // If we don't have the audio yet, generate it now
            window.tts.generateSpeech(name, message)
              .then(result => {
                if (result.success) {
                  // Update display before playing audio
                  nameDisplay.textContent = name;
                  messageDisplay.textContent = message;
                  container.style.display = 'block';
                  container.style.opacity = '1';
                  
                  // Create an audio element to play the sound
                  const audio = new Audio(`file://${result.audioPath}`);
                  
                  // Set up event handlers
                  audio.onended = () => {
                    console.log("ElevenLabs TTS playback completed");
                    // Notify main process that TTS playback is complete
                    if (window.api) {
                      window.api.send('tts-complete');
                    }
                    resolve();
                  };
                  
                  audio.onerror = (e) => {
                    console.error("Audio playback error:", e);
                    resolve(); // Resolve anyway to prevent blocking
                  };
                  
                  // Play the audio
                  audio.play().catch(err => {
                    console.error("Error playing audio:", err);
                    resolve();
                  });
                } else {
                  console.error("TTS generation failed:", result.error);
                  fallbackToBuiltInTTS(name, message, resolve);
                }
              })
              .catch(error => {
                console.error("Error with ElevenLabs TTS:", error);
                fallbackToBuiltInTTS(name, message, resolve);
              });
          }
        } else {
          // Fall back to browser's built-in TTS if ElevenLabs is not available
          fallbackToBuiltInTTS(name, message, resolve);
        }
      });
    }
    
    // Fallback to browser's built-in TTS
    function fallbackToBuiltInTTS(name, message, resolve) {
      if ('speechSynthesis' in window) {
        // Update display before playing audio
        nameDisplay.textContent = name;
        messageDisplay.textContent = message;
        container.style.display = 'block';
        container.style.opacity = '1';
        
        // Cancel any pending speech first
        window.speechSynthesis.cancel();
        
        const speech = new SpeechSynthesisUtterance();
        speech.text = `${name} sent a message: ${message}`;
        speech.volume = 1;
        speech.rate = 1;
        speech.pitch = 1;
        
        // Add event listener for when speech completes
        speech.onend = () => {
          console.log("Built-in TTS completed");
          resolve();
        };
        
        speech.onerror = (event) => {
          console.error("Speech error:", event);
          resolve();
        };
        
        window.speechSynthesis.speak(speech);
      } else {
        resolve(); // No TTS available
      }
    }
    
    // Main animation frame
    function animationFrame(timestamp) {
      if (!animationRunning) return;
      
      // Calculate delta time
      if (!lastTimestamp) lastTimestamp = timestamp;
      const deltaTime = timestamp - lastTimestamp;
      lastTimestamp = timestamp;
      
      // Update time elapsed
      timeElapsed += deltaTime;
      
      // Handle different animation states
      if (fadeState === 'in') {
        // Fade in animation (500ms)
        const progress = Math.min(timeElapsed / 500, 1);
        container.style.opacity = progress.toString();
        
        if (timeElapsed >= 500) {
          fadeState = 'display';
          timeElapsed = 0;
          
          // Speak the message and wait for completion
          if (currentItem) {
            speakMessage(currentItem.name, currentItem.message)
              .then(() => {
                // Now enter the display state
                fadeState = 'display';
                timeElapsed = 0;
              });
            // Set a temporary state while speaking
            fadeState = 'speaking';
          } else {
            fadeState = 'display';
          }
        }
      } else if (fadeState === 'speaking') {
        // Do nothing while speech is in progress
        // The promise callback will move us to the next state
      } else if (fadeState === 'display') {
        // Display duration (8000ms)
        if (timeElapsed >= 8000) {
          fadeState = 'out';
          timeElapsed = 0;
        }
      } else if (fadeState === 'out') {
        // Fade out animation (500ms)
        const progress = 1 - Math.min(timeElapsed / 500, 1);
        container.style.opacity = progress.toString();
        
        if (timeElapsed >= 500) {
          // Move to next message
          if (messageQueue.length > 0) {
            currentIndex = (currentIndex + 1) % messageQueue.length;
            currentItem = messageQueue[currentIndex];
          }
          
          fadeState = 'in';
          timeElapsed = 0;
        }
      }
      
      // Continue animation loop
      requestAnimationFrame(animationFrame);
    }
    
    // Add a new message to the queue
    function addMessage(name, message) {
      // Create a unique identifier for this message
      const messageId = `${name}:${message}:${Date.now()}`;
      
      // Skip if we've seen this exact message in the last second
      // This helps prevent duplicate TTS for the same message
      for (const id of processedMessages) {
        const [oldName, oldMessage, timestamp] = id.split(':', 3);
        
        // If same name/message and received within last 3 seconds, ignore it
        if (oldName === name && oldMessage === message && 
            Date.now() - parseInt(timestamp) < 3000) {
          console.log('Ignoring duplicate message:', message);
          return;
        }
      }
      
      // Add to processed set and queue
      processedMessages.add(messageId);
      messageQueue.push({ name, message });
      
      // Limit size of processed set to avoid memory leaks
      if (processedMessages.size > 100) {
        const iterator = processedMessages.values();
        processedMessages.delete(iterator.next().value);
      }
    }
    
    // Listen for HCS messages from the main process
    if (window.api) {
      // Handle connection status updates
      window.api.receive('hcs-connection-status', (status) => {
        console.log('HCS connection status:', status);
      });
      
      // Handle queue updates
      window.api.receive('queue-update', (count) => {
        console.log('Queue update:', count);
      });
      
      // Handle incoming messages
      window.api.receive('hcs-message', (message) => {
        console.log('Received HCS message:', message);
        if (message && message.name && message.message) {
          // Start TTS generation immediately
          if (window.tts) {
            window.tts.generateSpeech(message.name, message.message)
              .then(result => {
                if (result.success) {
                  // Store the audio path for later use
                  message.audioPath = result.audioPath;
                }
              })
              .catch(error => {
                console.error("Error with ElevenLabs TTS:", error);
              });
          }
          
          // Add to queue and display
          addMessage(message.name, message.message);
        }
      });
    } else {
      console.warn('API not available. Running in browser mode without Hedera connection.');
    }
    
    // Start the force rendering to keep animations running in background
    forceRendering();
    
    // Start the animation system
    setTimeout(() => {
      startAnimation();
    }, 1000);
    
    // Keep the app running in background by triggering events
    setInterval(() => {
      // Create a dummy event to keep the page active
      document.dispatchEvent(new CustomEvent('keepalive'));
    }, 1000);
  </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Message Display App</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background-color: transparent;
    }
    body {
      font-family: Arial, sans-serif;
      color: black;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      cursor: default;
      -webkit-user-select: none;
      user-select: none;
    }
    .container {
      padding: 30px;
      background-color: transparent;
      border-radius: 15px;
      max-width: 80%;
      transition: opacity 0.5s ease-in-out;
    }
    .name {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 10px;
      color: black;
    }
    .message {
      font-size: 18px;
      line-height: 1.4;
      color: black;
    }
    .queue-stats {
      position: absolute;
      bottom: 10px;
      right: 10px;
      font-size: 12px;
      color: black;
    }
    .drag-area {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 30px;
      -webkit-app-region: drag;
    }
  </style>
</head>
<body>
  <div class="drag-area"></div>
  <div class="container" id="message-container">
    <div class="name" id="name-display">Loading messages...</div>
    <div class="message" id="message-display">Please wait</div>
  </div>
  <div class="queue-stats" id="queue-stats">Queue: 0</div>

  <script>
    // Message queue system
    const messageQueue = [
      { name: "Alice", message: "Hello, this is a test message!" },
      { name: "Bob", message: "How does this system work?" },
      { name: "Charlie", message: "This is a longer message to test how the display handles multi-line content that might wrap to multiple lines." },
      { name: "David", message: "Testing text-to-speech functionality." },
      { name: "Emma", message: "Final test message in the queue." }
    ];
    
    let currentIndex = 0;
    const container = document.getElementById('message-container');
    const nameDisplay = document.getElementById('name-display');
    const messageDisplay = document.getElementById('message-display');
    const queueStats = document.getElementById('queue-stats');
    
    // Animation variables
    let animationRunning = false;
    let lastTimestamp = 0;
    let currentTimeout = null;
    let timeElapsed = 0;
    let fadeState = 'in'; // 'in', 'display', 'out'
    let currentItem = null;
    
    // Force the renderer to keep working even when the page is in background
    const forceRendering = () => {
      // Create a tiny canvas element and change it slightly each frame
      const canvas = document.createElement('canvas');
      canvas.width = 1;
      canvas.height = 1;
      const ctx = canvas.getContext('2d');
      let frame = 0;
      
      function tick() {
        frame++;
        // Draw something different each frame to force a redraw
        ctx.fillStyle = `rgb(${frame % 255},0,0)`;
        ctx.fillRect(0, 0, 1, 1);
        requestAnimationFrame(tick);
      }
      
      requestAnimationFrame(tick);
    };
    
    // Start the animation system
    function startAnimation() {
      if (animationRunning) return;
      animationRunning = true;
      
      // Initial setup
      container.style.opacity = 0;
      timeElapsed = 0;
      fadeState = 'in';
      
      // Update the display once to ensure we have content
      if (messageQueue.length > 0) {
        currentItem = messageQueue[currentIndex];
        nameDisplay.textContent = currentItem.name;
        messageDisplay.textContent = currentItem.message;
        queueStats.textContent = `Queue: ${messageQueue.length - currentIndex}`;
      } else {
        nameDisplay.textContent = "No messages";
        messageDisplay.textContent = "Queue is empty";
        queueStats.textContent = "Queue: 0";
      }
      
      // Start animation loop
      requestAnimationFrame(animationFrame);
    }
    
    // Main animation frame
    function animationFrame(timestamp) {
      if (!animationRunning) return;
      
      // Calculate delta time
      if (!lastTimestamp) lastTimestamp = timestamp;
      const deltaTime = timestamp - lastTimestamp;
      lastTimestamp = timestamp;
      
      // Update time elapsed
      timeElapsed += deltaTime;
      
      // Handle different animation states
      if (fadeState === 'in') {
        // Fade in animation (500ms)
        const progress = Math.min(timeElapsed / 500, 1);
        container.style.opacity = progress.toString();
        
        if (timeElapsed >= 500) {
          fadeState = 'display';
          timeElapsed = 0;
          
          // Speak the message
          if (currentItem) {
            speakMessage(currentItem.name, currentItem.message);
          }
        }
      } else if (fadeState === 'display') {
        // Display duration (8000ms)
        if (timeElapsed >= 8000) {
          fadeState = 'out';
          timeElapsed = 0;
        }
      } else if (fadeState === 'out') {
        // Fade out animation (500ms)
        const progress = 1 - Math.min(timeElapsed / 500, 1);
        container.style.opacity = progress.toString();
        
        if (timeElapsed >= 500) {
          // Move to next message
          if (messageQueue.length > 0) {
            currentIndex = (currentIndex + 1) % messageQueue.length;
            currentItem = messageQueue[currentIndex];
            
            // Update display
            nameDisplay.textContent = currentItem.name;
            messageDisplay.textContent = currentItem.message;
            queueStats.textContent = `Queue: ${messageQueue.length - currentIndex}`;
          }
          
          fadeState = 'in';
          timeElapsed = 0;
        }
      }
      
      // Continue animation loop
      requestAnimationFrame(animationFrame);
    }
    
    // Function to speak the message using text-to-speech
    function speakMessage(name, message) {
      if ('speechSynthesis' in window) {
        const speech = new SpeechSynthesisUtterance();
        speech.text = `${name} sent a message: ${message}`;
        speech.volume = 1;
        speech.rate = 1;
        speech.pitch = 1;
        window.speechSynthesis.speak(speech);
      }
    }
    
    // Add a new message to the queue
    function addMessage(name, message) {
      messageQueue.push({ name, message });
      queueStats.textContent = `Queue: ${messageQueue.length - currentIndex}`;
    }
    
    // For testing: Add a message after 15 seconds
    setTimeout(() => {
      addMessage("New User", "This message was added dynamically!");
    }, 15000);
    
    // Start the force rendering to keep animations running in background
    forceRendering();
    
    // Start the animation system
    setTimeout(() => {
      startAnimation();
    }, 1000);
    
    // Keep the app running in background by triggering events
    setInterval(() => {
      // Create a dummy event to keep the page active
      document.dispatchEvent(new CustomEvent('keepalive'));
    }, 1000);
  </script>
</body>
</html>
